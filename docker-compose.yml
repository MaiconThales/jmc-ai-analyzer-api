name: jmc-ai-analyzer

services:
  frontend:
    image: ${FRONTEND_IMAGE}
    user: ${FRONTEND_USER}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:8080"
    volumes:
      - ./docker/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=1777
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0 | grep -q '^ok$'"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JFR_DATA_DIR: /data/jfr
      MCP_ENABLED: ${MCP_ENABLED}
      MCP_JAR_PATH: ${MCP_JAR_PATH}
      MCP_ARTIFACT_VERSION: ${MCP_ARTIFACT_VERSION}
      MCP_JAR_SHA256: ${MCP_JAR_SHA256}
      MCP_COMMAND: ${MCP_COMMAND}
      MCP_ARGUMENTS: ${MCP_ARGUMENTS}
      MCP_STARTUP_TIMEOUT: ${MCP_STARTUP_TIMEOUT}
      ANALYSIS_MAX_CONCURRENT: ${ANALYSIS_MAX_CONCURRENT}
      ANALYSIS_STAGE_TIMEOUT: ${ANALYSIS_STAGE_TIMEOUT}
      ANALYSIS_SESSION_TIMEOUT: ${ANALYSIS_SESSION_TIMEOUT}
      FRONTEND_ALLOWED_ORIGINS: ${FRONTEND_ALLOWED_ORIGINS}
      AI_ENABLED: ${AI_ENABLED}
      AI_PROVIDER: ${AI_PROVIDER}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_MODEL: ${AI_MODEL}
      AI_TIMEOUT: ${AI_TIMEOUT}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION}
      AI_API_KEY: ${AI_API_KEY}
    volumes:
      - jfr-data:/data/jfr:ro
      - ${MCP_ARTIFACT_PATH}:/opt/mcp/mcp-server-jmc.jar:ro
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  jfr-data:
  pg-data:

networks:
  app-net:
