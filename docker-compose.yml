# Todos os dados ficam em ${DATA_DIR} na máquina real (bind mounts). Não há named volumes:
# reiniciar, recriar ou rodar "docker compose down -v" não apaga nada.
# Basta "cp .env.example .env" (trocando os "change-me") e "docker compose up -d --build":
# o serviço data-init prepara as pastas e o blob gera a própria configuração S3.

name: jmc-ai-analyzer

services:
  # Cria as pastas de dados no host com o dono certo (roda uma vez a cada "up" e termina).
  data-init:
    image: alpine:3.22
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -c
      - >-
        mkdir -p /data/postgres /data/seaweedfs /data/api/logs /data/api/tmp /data/frontend/logs /data/mcp
        && chown -R ${APP_UID:-1000}:${APP_GID:-1000} /data/api
        && chown -R 101:101 /data/frontend/logs
    volumes:
      - ${DATA_DIR}:/data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  blob:
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
    environment:
      BLOB_ACCESS_KEY: ${BLOB_ACCESS_KEY}
      BLOB_SECRET_KEY: ${BLOB_SECRET_KEY}
    # Gera a configuração S3 (credenciais) a partir do .env na inicialização: nenhum arquivo no host.
    # Use apenas letras, números, "-" e "_" nas chaves.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"api","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$BLOB_ACCESS_KEY" "$$BLOB_SECRET_KEY" > /tmp/s3.json
        && exec /entrypoint.sh server -s3 -dir=/data -s3.config=/tmp/s3.json -ip.bind=0.0.0.0
    volumes:
      - ${DATA_DIR}/seaweedfs:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      args:
        APP_UID: ${APP_UID}
        APP_GID: ${APP_GID}
    image: jmc-ai-analyzer-api:0.1.0
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      blob:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BLOB_ENDPOINT: http://blob:8333
      BLOB_BUCKET: ${BLOB_BUCKET}
      BLOB_ACCESS_KEY: ${BLOB_ACCESS_KEY}
      BLOB_SECRET_KEY: ${BLOB_SECRET_KEY}
      APP_UPLOAD_MAX_FILES: ${APP_UPLOAD_MAX_FILES}
      APP_UPLOAD_MAX_FILE_SIZE: ${APP_UPLOAD_MAX_FILE_SIZE}
      APP_UPLOAD_MAX_REQUEST_SIZE: ${APP_UPLOAD_MAX_REQUEST_SIZE}
      APP_ANALYSIS_MAX_CONCURRENT: ${APP_ANALYSIS_MAX_CONCURRENT}
      APP_ANALYSIS_TIMEOUT: ${APP_ANALYSIS_TIMEOUT}
      APP_RETENTION_DEFAULT_DAYS: ${APP_RETENTION_DEFAULT_DAYS}
      APP_RETENTION_CRON: ${APP_RETENTION_CRON}
      JAVA_OPTS: ${JAVA_OPTS}
    volumes:
      - ${DATA_DIR}/api/logs:/app/logs
      - ${DATA_DIR}/api/tmp:/app/tmp
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT}

  frontend:
    build:
      context: ${FRONTEND_CONTEXT}
    image: jmc-ai-analyzer-web:0.1.0
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:8080"
    environment:
      API_UPSTREAM: http://api:8080
      POLLING_INTERVAL_MS: ${FRONTEND_POLLING_INTERVAL_MS}
    volumes:
      - ${DATA_DIR}/frontend/logs:/var/log/nginx

  # --- Futuro (WIP): segue a mesma regra, qualquer estado em ${DATA_DIR}/<serviço>/ ---
