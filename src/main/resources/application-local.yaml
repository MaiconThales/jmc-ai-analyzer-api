spring:
  datasource:
    url: jdbc:h2:mem:jmc_ai_analyzer;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

frontend:
  allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:4200}

jfr:
  data-dir: ${JFR_DATA_DIR:./jfr-data}
  catalog:
    max-files: ${JFR_CATALOG_MAX_FILES:100}

mcp:
  enabled: ${MCP_ENABLED:false}
  command: ${MCP_COMMAND:java}
  arguments: ${MCP_ARGUMENTS:}
  startup-timeout: ${MCP_STARTUP_TIMEOUT:5s}
  transport: ${MCP_TRANSPORT:lines}

analysis:
  max-concurrent: ${ANALYSIS_MAX_CONCURRENT:2}
  stage-timeout: ${ANALYSIS_STAGE_TIMEOUT:30s}
  session-timeout: ${ANALYSIS_SESSION_TIMEOUT:2m}

ai:
  enabled: ${AI_ENABLED:false}
  provider: ${AI_PROVIDER:provider-neutral}
  base-url: ${AI_BASE_URL:http://localhost:11434/v1/chat/completions}
  model: ${AI_MODEL:default}
  timeout: ${AI_TIMEOUT:30s}
  retry-max-attempts: ${AI_RETRY_MAX_ATTEMPTS:1}
  prompt-version: ${AI_PROMPT_VERSION:analysis-prompt-v1}
  api-key: ${AI_API_KEY:}
