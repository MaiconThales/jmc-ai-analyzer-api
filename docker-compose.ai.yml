services:
  backend:
    environment:
      AI_ENABLED: "true"
      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER is required for the ai profile}
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:11434/v1/chat/completions}
      AI_MODEL: ${AI_MODEL:?AI_MODEL must name a provisioned model}
      AI_TIMEOUT: ${AI_TIMEOUT:-30s}
      AI_RETRY_MAX_ATTEMPTS: ${AI_RETRY_MAX_ATTEMPTS:-2}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-analysis-prompt-v1}
      AI_API_KEY: ${AI_API_KEY:-}
    depends_on:
      ai:
        condition: service_healthy

  ai:
    image: ${AI_IMAGE:?AI_IMAGE must be a provisioned, versioned AI image (prefer a digest)}
    user: ${AI_USER:?AI_USER must be a non-root UID:GID supported by AI_IMAGE}
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ai-data:/var/lib/ollama
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

volumes:
  ai-data:
